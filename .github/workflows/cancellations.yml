name: Cancellations
# Runs at UK time (Europe/London), all year round:
#   Friday 18:00 and 21:00, Saturday 05:00, 06:00 and 07:00.
# GitHub only schedules in UTC, so each slot is listed for both GMT and BST,
# and the first step skips the run unless the UK clock shows one of those hours.
on:
  schedule:
    - cron: "0 17,18,20,21 * * 5"
    - cron: "0 4,5,6,7 * * 6"
  workflow_dispatch:
  push:
    paths: ['tools/update_cancellations.py', '.github/workflows/cancellations.yml']
permissions:
  contents: write
concurrency: cancellations
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check UK time
        id: uk
        run: |
          slot="$(TZ=Europe/London date +%u-%H)"
          echo "UK time: $(TZ=Europe/London date '+%a %d %b %H:%M %Z')"
          case "$slot" in
            5-18|5-21|6-05|6-06|6-07) echo "go=yes" >> "$GITHUB_OUTPUT" ;;
            *) if [ "${{ github.event_name }}" = "schedule" ]; then echo "go=no" >> "$GITHUB_OUTPUT"; echo "Not a UK-time slot, skipping"; else echo "go=yes" >> "$GITHUB_OUTPUT"; fi ;;
          esac
      - uses: actions/checkout@v4
        if: steps.uk.outputs.go == 'yes'
      - name: Refresh cancellations
        if: steps.uk.outputs.go == 'yes'
        run: |
          if python3 tools/update_cancellations.py > summary.txt 2> errors.txt; then
            echo "::notice::$(cat summary.txt)"; cat errors.txt
          else
            echo "::error::$(tr '\n' ' ' < errors.txt | tail -c 600)"; exit 1
          fi
      - name: Commit if anything changed
        if: steps.uk.outputs.go == 'yes'
        run: |
          git config user.name "Aaron Wright"
          git config user.email "aaronjwright@users.noreply.github.com"
          git add cancellations.json tools/uk_events.json
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Cancellations update" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
          git push
