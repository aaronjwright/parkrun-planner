name: Refresh completed events

# Sent by the planner (repository_dispatch) after the "Update parkrun planner" bookmarklet
# reads Aaron's parkrun results page on his phone.
on:
  repository_dispatch:
    types: [completed-refresh]

permissions:
  contents: write

concurrency:
  group: refresh-completed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check and save the extract
        run: python3 tools/check_extract.py "$GITHUB_EVENT_PATH" /tmp/extract.json

      - name: Update data.json
        run: python3 tools/update_done.py /tmp/extract.json >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        run: |
          if git diff --quiet -- data.json; then echo "No change to data.json"; exit 0; fi
          git config user.name "Aaron Wright"
          git config user.email "aaronjwright@users.noreply.github.com"
          git add data.json
          git commit -m "Refresh completed events (from phone)"
          git push
