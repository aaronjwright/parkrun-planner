<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Parkrun Travel Planner</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f6f5c">
<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--ink:#1d1f21;--muted:#6b6f73;--line:#e3e1dc;
  --accent:#1f6f5c;--accent-ink:#ffffff;--soft:#e8f2ee;--amber:#9a5b00;--amber-soft:#fdf1dc;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141516;--card:#1e2022;--ink:#ecebe8;--muted:#9a9ea2;--line:#2e3134;
  --accent:#4fb393;--accent-ink:#0f1a16;--soft:#1c2b26;--amber:#f0b252;--amber-soft:#2e2414;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:20px;margin:4px 0 10px;letter-spacing:-.01em;line-height:1.3;display:flex;align-items:center;gap:6px}
h1 .ti{font-size:22px;line-height:1;color:var(--accent);width:22px;height:22px;flex:none}
.status{display:flex;flex-direction:column;gap:6px;margin:0}
.status:has(.chip:not([hidden])){margin:-2px 0 10px}
.status[hidden],.chip[hidden]{display:none}
.pill{cursor:pointer}
.pill.open{outline:1.5px solid var(--accent);outline-offset:1px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:5px 10px;border-radius:999px;background:var(--soft);white-space:nowrap}
.pill .ti{font-size:15px;color:var(--accent)}
.pill.stale{background:var(--amber-soft);color:var(--amber)}
.pill.stale .ti{color:var(--amber)}
.pill.alert .ti{color:var(--amber)}
.chip{font-size:13px;padding:7px 10px;border-radius:10px;background:var(--soft);line-height:1.35}
.chip .t{display:block;font-weight:600}
.chip .d{display:block;color:var(--muted)}
.chip.stale .d{color:inherit}
.nw{white-space:nowrap}
.chip b{font-weight:600}
.chip.stale{background:var(--amber-soft);color:var(--amber)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
label.f{display:block;font-size:12px;color:var(--muted);margin:14px 0 4px;text-transform:uppercase;letter-spacing:.04em}
label.f:first-child{margin-top:0}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.row{display:flex;gap:10px}
.row>div{flex:1}
.startrow{display:flex;gap:8px}
.startrow input{flex:1}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.hint:empty{display:none}
#startHint:not(:empty){margin:8px 0 10px}
.err{color:var(--amber)}
.check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.check input{width:auto;accent-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:var(--bg);color:var(--ink);border-radius:0;padding:9px 4px;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
button,.btn{font:inherit;border:0;border-radius:10px;padding:10px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:600;width:100%;margin-top:12px}
.locbtn{background:var(--soft);color:var(--accent);width:44px;flex:none;padding:0}
.locbtn .ti{font-size:22px}
.locbtn.busy .ti{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.ttl{flex:1}
.iconbtn{background:none;border:0;padding:2px;border-radius:8px;color:var(--muted);line-height:0;cursor:pointer}
.iconbtn .ti{font-size:22px;color:inherit}
.iconbtn.on{background:var(--soft);color:var(--accent)}
#settings[hidden]{display:none}
.sethead{display:flex;align-items:center;font-weight:600}
.sethead span{flex:1}
.sethead .ti{font-size:18px}
.summary{font-size:13px;color:var(--muted);margin:0 2px 8px}
.summary:empty{display:none}
.sline{display:block}
.sline.warn{color:var(--amber);margin-top:2px}
.sline .ti{font-size:14px;vertical-align:-2px;margin-right:4px}
ol{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.card{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"rank name leave nav" ". meta leave nav";column-gap:10px;row-gap:2px;align-items:center;padding:10px 12px}
.card .rank{grid-area:rank;align-self:start}
.card .name{grid-area:name;align-self:start}
.card .leave{grid-area:leave;line-height:1.15}
.card .navbtn{grid-area:nav}
.card .meta{grid-area:meta}
.rank{font-weight:700;color:var(--accent);min-width:18px;line-height:1.35}
.name{font-weight:600;font-size:16px;line-height:1.35;display:block}
.name a{color:inherit;text-decoration:none}
.leave{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.leave b{display:block;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
.meta{font-size:13px;color:var(--muted);line-height:1.45}
.navbtn{width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center}
.navbtn .ti{font-size:22px}
.nav{background:var(--accent);color:var(--accent-ink);font-weight:600}
.ghost{background:transparent;border:1px solid var(--line)!important;color:var(--ink)}
.ghost.confirm{border-color:var(--amber)!important;color:var(--amber);background:var(--amber-soft)}
.spare{display:block;font-size:12px;color:var(--accent);margin-top:1px}
.card.tight .spare,.card.late .spare{color:var(--amber)}
.card.late{opacity:.55}
.card.cancelled{opacity:.55}
.card.cancelled .leave b{font-size:15px;color:var(--amber)}
.card.cancelled .spare{color:var(--amber)}
.divider{list-style:none;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:6px 2px 0}
.chip .bar{display:block;height:6px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
.chip .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.chip .bar.warn i{background:var(--amber)}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;background:var(--line);color:var(--ink);margin-right:2px}
.tag.new{background:var(--soft);color:var(--accent)}
.tag.live{background:var(--accent);color:var(--accent-ink)}
footer{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.5}
footer p{margin:0 0 6px}
</style>
</head>
<body>
<main>
<h1><svg class="ti" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/><path d="M4 17l5 1l.75 -1.5"/><path d="M15 21l0 -4l-4 -3l1 -6"/><path d="M7 12l0 -3l5 -1l3 3l3 1"/></svg><span class="ttl">Parkrun Travel Planner</span><button type="button" class="iconbtn" id="setBtn" aria-label="Settings" aria-expanded="false" aria-controls="settings"><svg class="ti" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z"/><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/></svg></button></h1>

<div class="pills" id="pills">
  <span class="pill" id="evChipP" role="button" tabindex="0" aria-expanded="false" data-for="evChip"><svg class="ti" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5.5l1.5 1.5l2.5 -2.5"/><path d="M3.5 11.5l1.5 1.5l2.5 -2.5"/><path d="M3.5 17.5l1.5 1.5l2.5 -2.5"/><path d="M11 6l9 0"/><path d="M11 12l9 0"/><path d="M11 18l9 0"/></svg>Loading…</span>
  <span class="pill" id="doneChipP" role="button" tabindex="0" aria-expanded="false" data-for="doneChip"></span>
  <span class="pill" id="cancChipP" role="button" tabindex="0" aria-expanded="false" data-for="cancChip"></span>
  <span class="pill" id="liveChipP" role="button" tabindex="0" aria-expanded="false" data-for="liveChip"></span>
</div>
<div class="status" id="statusDetail">
  <div class="chip" id="evChip" hidden></div>
  <div class="chip" id="doneChip" hidden></div>
  <div class="chip" id="cancChip" hidden></div>
  <div class="chip" id="liveChip" hidden></div>
</div>

<section class="panel" id="settings" hidden>
  <div class="sethead"><span>Settings</span><button type="button" class="iconbtn" id="setClose" aria-label="Close settings"><svg class="ti" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg></button></div>
    <label class="f" for="car">Car</label>
    <select id="car">
      <option value="GASOLINE">Petrol</option>
      <option value="DIESEL">Diesel</option>
      <option value="HYBRID">Hybrid</option>
      <option value="ELECTRIC">Electric</option>
    </select>
    <label class="f" for="traffic">Traffic assumption</label>
    <select id="traffic">
      <option value="BEST_GUESS">Best guess (uses live traffic)</option>
      <option value="PESSIMISTIC">Cautious (a bad traffic day)</option>
      <option value="OPTIMISTIC">Optimistic (a good traffic day)</option>
    </select>
    <label class="check"><input type="checkbox" id="avTolls"> Avoid tolls</label>
    <label class="check"><input type="checkbox" id="avHigh"> Avoid motorways</label>
    <label class="check"><input type="checkbox" id="avFerry"> Avoid ferries</label>
    <label class="f" for="key">Google Maps key</label>
    <input id="key" type="password" autocomplete="off" placeholder="Paste your key once">
    <div class="hint">Saved on this phone only. Without a key the planner uses distance-based estimates.</div>
    <label class="f" for="counter">Google usage link</label>
    <input id="counter" type="password" autocomplete="off" placeholder="Paste the usage link once">
    <div class="hint">Shows Google’s own count of this month’s usage, across all your devices.</div>
</section>
<section class="panel">
  <label class="f" for="start">Start from</label>
  <div class="startrow">
    <input id="start" list="places" autocomplete="off" placeholder="Postcode, town or parkrun">
    <button class="locbtn" id="gps" type="button" aria-label="Use my current location" title="Use my current location"><svg class="ti" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12m-3 0a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" /><path d="M12 12m-8 0a8 8 0 1 0 16 0a8 8 0 1 0 -16 0" /><path d="M12 2l0 2" /><path d="M12 20l0 2" /><path d="M20 12l2 0" /><path d="M2 12l2 0" /></svg></button>
  </div>
  <datalist id="places"></datalist>
  <div class="hint" id="startHint"></div>

  <div class="row">
    <div><label class="f" for="date">Date</label><select id="date"></select></div>
    <div><label class="f" for="early">Arrive early</label><select id="early"></select></div>
  </div>

  <label class="f">Route</label>
  <div class="seg" id="routeSeg">
    <button data-v="fastest" class="on" type="button">Fastest</button>
    <button data-v="shortest" type="button">Shortest</button>
    <button data-v="eco" type="button">Economical</button>
  </div>

  <label class="check"><input type="checkbox" id="incDone"> Include events I’ve done</label>


  <button class="primary" id="go" type="button">Refresh my top 10</button>
</section>

<p class="summary" id="summary"></p>
<ol id="list"></ol>
<footer id="foot"></footer>
</main>

<script>
(async function(){
const ICONS={"navigation":"<path d=\"M12 18.5l7.265 2.463c.196 .077 .42 .032 .57 -.116a.548 .548 0 0 0 .134 -.572l-7.969 -17.275l-7.97 17.275c-.07 .2 -.017 .424 .135 .572c.15 .148 .374 .193 .57 .116l7.265 -2.463\"/>","run": "<path d=\"M13 4m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0\"/><path d=\"M4 17l5 1l.75 -1.5\"/><path d=\"M15 21l0 -4l-4 -3l1 -6\"/><path d=\"M7 12l0 -3l5 -1l3 3l3 1\"/>", "settings": "<path d=\"M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z\"/><path d=\"M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0\"/>", "list-check": "<path d=\"M3.5 5.5l1.5 1.5l2.5 -2.5\"/><path d=\"M3.5 11.5l1.5 1.5l2.5 -2.5\"/><path d=\"M3.5 17.5l1.5 1.5l2.5 -2.5\"/><path d=\"M11 6l9 0\"/><path d=\"M11 12l9 0\"/><path d=\"M11 18l9 0\"/>", "flag": "<path d=\"M5 5a5 5 0 0 1 7 0a5 5 0 0 0 7 0v9a5 5 0 0 1 -7 0a5 5 0 0 0 -7 0v-9z\"/><path d=\"M5 21v-7\"/>", "ban": "<path d=\"M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0\"/><path d=\"M5.7 5.7l12.6 12.6\"/>", "car": "<path d=\"M7 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0\"/><path d=\"M17 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0\"/><path d=\"M5 17h-2v-6l2 -5h9l4 5h1a2 2 0 0 1 2 2v4h-2m-4 0h-6m-6 -6h15m-6 0v-5\"/>", "x": "<path d=\"M18 6l-12 12\"/><path d=\"M6 6l12 12\"/>"};
const ic=n=>`<svg class="ti" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||""}</svg>`;
const $=id=>document.getElementById(id);
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const HOME={name:"Hethersett (home)",lat:52.6005,lon:1.1745};
const LOC="Current location", LOC_MAX_AGE=30*60000;
const CANDIDATES=25;   // nearest by straight line sent to Google for live times
const fmtDate=iso=>new Date(iso+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const todayIso=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};

// ---------- data ----------
let DATA;
try{DATA=await (await fetch("data.json",{cache:"no-store"})).json()}catch(e){$("evChip").textContent="Couldn’t load data.json";return}
const doneInfo={};
DATA.done.forEach(l=>{const [slug,c,last]=l.split("|");doneInfo[slug]={count:+c,last}});

let rawEvents=null, eventsSource="snapshot";
try{
  const r=await fetch("https://images.parkrun.com/events.json",{cache:"no-store"});
  const j=await r.json();
  rawEvents=j.events.features.filter(f=>f.properties.countrycode===97&&f.properties.seriesid===1)
    .map(f=>({slug:f.properties.eventname,name:f.properties.EventShortName,lat:f.geometry.coordinates[1],lon:f.geometry.coordinates[0]}));
  eventsSource="live";
}catch(e){}
if(!rawEvents){
  rawEvents=DATA.snapshot.split("\n").filter(Boolean).map(l=>{const [slug,name,lat,lon]=l.split("|");return {slug,name,lat:+lat,lon:+lon}});
}

function isNI(e){return e.lon<-5.4&&e.lat>54&&e.lat<55.35}
function isScotland(lat,lon){
  if(lon<-3.1) return lat>54.9||(lon<-4.3&&lat>54.6);
  if(lon<=-2.0){const p=[[-3.1,54.98],[-2.6,55.15],[-2.2,55.35],[-2.0,55.80]];
    for(let i=0;i<p.length-1;i++){const [x1,y1]=p[i],[x2,y2]=p[i+1];if(lon>=x1&&lon<=x2)return lat>y1+(lon-x1)/(x2-x1)*(y2-y1)}}
  return lat>55.8;
}
const all=rawEvents.map(e=>({...e,done:!!doneInfo[e.slug],count:doneInfo[e.slug]?.count||0,startMin:(isScotland(e.lat,e.lon)||isNI(e))?570:540}));
const todoCount=all.filter(e=>!e.done).length;
let CANC=null;
try{CANC=await (await fetch("cancellations.json",{cache:"no-store"})).json()}catch(e){}
const norm=n=>String(n).toLowerCase().replace(/[’']/g,"'").replace(/\s+parkrun$/,"").trim();
function cancFor(dateIso){
  const m={}; if(CANC&&CANC.date===dateIso)(CANC.events||[]).forEach(c=>m[norm(c.name)]=c.reason||"Cancelled"); return m;
}

// ---------- status chips ----------
const ageDays=iso=>(Date.now()-new Date(iso+"T12:00:00"))/864e5;
const chip=(el,title,parts,stale,overdue=stale,pill=null)=>{el.innerHTML=`<span class="t">${title}${overdue?" · overdue":""}</span><span class="d">${parts.map(p=>`<span class="nw">${p}</span>`).join(" · ")}</span>`;el.classList.toggle("stale",!!stale);
  const pe=document.getElementById(el.id+"P"); if(pe&&pill){pe.innerHTML=`${ic(pill.icon)}${pill.text}${overdue?" · overdue":""}`;pe.classList.toggle("stale",!!stale);pe.classList.toggle("alert",!!pill.alert)}};
chip($("evChip"),"Events list",[eventsSource==="live"?"live from parkrun":`updated ${fmtDate(DATA.eventsUpdated)}`,`${todoCount} UK events left to do`],eventsSource!=="live"&&ageDays(DATA.eventsUpdated)>10,undefined,{icon:"list-check",text:`${todoCount} left${eventsSource==="live"?" · live":""}`});
chip($("doneChip"),`Completed list · updated ${fmtDate(DATA.completedUpdated)}`,[`Latest: ${DATA.latest}`,`${DATA.totalRuns} runs`,`${DATA.distinct} events`],ageDays(DATA.completedUpdated)>10,undefined,{icon:"flag",text:`Updated ${new Date(DATA.completedUpdated+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"})}`});

// ---------- settings ----------
const els={start:$("start"),date:$("date"),early:$("early"),inc:$("incDone"),car:$("car"),traffic:$("traffic"),tolls:$("avTolls"),high:$("avHigh"),ferry:$("avFerry"),key:$("key"),counter:$("counter")};
let routeType=store.get("ptp.route","eco");
function setRoute(v){routeType=v;[...$("routeSeg").children].forEach(b=>b.classList.toggle("on",b.dataset.v===v))}
setRoute(routeType);
$("routeSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(b){setRoute(b.dataset.v);store.set("ptp.route",routeType);run(lastLive)}});
els.start.value=store.get("ptp.start",HOME.name);
els.early.innerHTML=[0,5,10,15,20,25,30,35,40,45,50,55,60,75,90].map(m=>`<option value="${m}">${m} min</option>`).join("");
els.early.value=String(store.get("ptp.early",30));
if(!els.early.value)els.early.value="30";
els.inc.checked=store.get("ptp.incDone",false);
els.car.value=store.get("ptp.car","ELECTRIC");
els.traffic.value=store.get("ptp.traffic","BEST_GUESS");
els.tolls.checked=store.get("ptp.tolls",false);
els.high.checked=store.get("ptp.high",false);
els.ferry.checked=store.get("ptp.ferry",false);
els.key.value=store.get("ptp.key","");els.counter.value=store.get("ptp.counter","");
function saveSettings(){
  store.set("ptp.start",els.start.value);store.set("ptp.early",+els.early.value||0);store.set("ptp.incDone",els.inc.checked);
  store.set("ptp.car",els.car.value);store.set("ptp.traffic",els.traffic.value);store.set("ptp.tolls",els.tolls.checked);
  store.set("ptp.high",els.high.checked);store.set("ptp.ferry",els.ferry.checked);store.set("ptp.key",els.key.value.trim());store.set("ptp.counter",els.counter.value.trim());
}
function nextSat(){const d=new Date();const add=(6-d.getDay()+7)%7;if(add===0&&d.getHours()>=9)d.setDate(d.getDate()+7);else d.setDate(d.getDate()+add);return d}
// date list: the next 12 Saturdays plus Christmas Day and New Year's Day when they fall in that window
(function(){
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const DAY=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const label=d=>`${String(d.getDate()).padStart(2,"0")}-${MON[d.getMonth()]}-${d.getFullYear()}`;
  const first=nextSat(), opts=[];
  for(let i=0;i<12;i++){const d=new Date(first);d.setDate(first.getDate()+7*i);opts.push({d,extra:""})}
  const last=opts[opts.length-1].d, today=new Date();today.setHours(0,0,0,0);
  [[11,25,"Christmas Day"],[0,1,"New Year’s Day"]].forEach(([m,day,name])=>{
    for(const y of [today.getFullYear(),today.getFullYear()+1]){
      const d=new Date(y,m,day);
      if(d>=today&&d<=last){const o=opts.find(o=>iso(o.d)===iso(d)); if(o)o.extra=name; else if(d.getDay()!==6)opts.push({d,extra:name})}
    }
  });
  opts.sort((a,b)=>a.d-b.d);
  els.date.innerHTML=opts.map(o=>`<option value="${iso(o.d)}">${label(o.d)}${o.extra?" ("+(d=>d.getDay()===6?"":DAY[d.getDay()]+", ")(o.d)+o.extra+")":""}</option>`).join("");
  els.date.value=iso(first);
})();
// ---------- Google usage this month (read from Google via the usage link) ----------
// Without the link, falls back to counting this device's refreshes (180 ≈ 4,500 of the 5,000 free).
const FREE=5000, STOP_AT=4500, PER_REFRESH=25, MONTHLY_LIMIT=180, DAILY_SAFETY=20;
const monthIso=()=>todayIso().slice(0,7);
const usageUrl=fresh=>{const u=els.counter.value.trim();return u?`${u}${u.includes("?")?"&":"?"}${fresh?"fresh=1":"v=1"}`:""};
const gUsed=g=>Math.max(g.matrix||0,g.routes||0);
function googleUsage(){const g=store.get("ptp.google",null);return g&&g.resetsAt&&new Date(g.resetsAt)>new Date()?g:null}
async function fetchUsage(fresh){
  const u=usageUrl(fresh); if(!u) return null;
  try{const r=await (await fetch(u)).json(); if(r&&r.source==="google"&&typeof r.matrix==="number"){store.set("ptp.google",r);return r}}catch(e){}
  return null;
}
async function syncCount(){ if(!els.counter.value.trim()) store.set("ptp.google",null); else await fetchUsage(false); liveChip(); }
async function takeRefresh(){
  const dayKey="ptp.refresh."+todayIso(), day=store.get(dayKey,0), mKey="ptp.mcount."+monthIso(), mine=store.get(mKey,0);
  if(day>=DAILY_SAFETY) return `Daily safety limit of ${DAILY_SAFETY} live refreshes reached on this device, so showing estimates.`;
  const g=els.counter.value.trim()?await fetchUsage(true):null;
  if(g){ if(gUsed(g)+PER_REFRESH>STOP_AT) return `Estimated times until ${resetShort(g)} · Google allowance nearly used`;
    store.set("ptp.google",{...g,matrix:g.matrix+PER_REFRESH,routes:g.routes+10}); }
  else if(mine>=MONTHLY_LIMIT) return `This device has used its ${MONTHLY_LIMIT} live refreshes this month, so showing estimates.`;
  store.set(dayKey,day+1); store.set(mKey,mine+1); return "";
}
const resetShort=g=>new Date(g.resetsAt).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const resetLabel=g=>{const d=new Date(g.resetsAt);return `${d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})} at ${d.toLocaleTimeString("en-GB",{hour:"numeric",minute:"2-digit"})}`};
function usageText(){const g=googleUsage();return g?`Google usage this month: ${gUsed(g).toLocaleString("en-GB")} of ${FREE.toLocaleString("en-GB")} free`:`Live refreshes this month: ${store.get("ptp.mcount."+monthIso(),0)} of ${MONTHLY_LIMIT} (this device)`}
function liveChip(){
  const on=!!els.key.value.trim(), g=googleUsage();
  const used=g?gUsed(g):store.get("ptp.mcount."+monthIso(),0), max=g?FREE:MONTHLY_LIMIT, pct=Math.min(100,used/max*100);
  const parts=!on?["add your Google key in Settings (cog icon, top right)"]:g?[`${used.toLocaleString("en-GB")} of ${FREE.toLocaleString("en-GB")} free · resets ${resetShort(g)}`]:[`${used} of ${MONTHLY_LIMIT} live refreshes this month`,"this device only"];
  const paused=on&&(g?used+PER_REFRESH>STOP_AT:used>=MONTHLY_LIMIT);
  chip($("liveChip"),`Live traffic ${!on?"off":paused?"paused":"on"}${on&&g?" · Google’s count":""}`,parts,!on||paused,false,{icon:"car",text:!on?"Traffic off":paused?"Live paused":"Live traffic"});
  if(on) $("liveChip").insertAdjacentHTML("beforeend",`<span class="bar${pct>=75?" warn":""}" role="progressbar" aria-valuemin="0" aria-valuemax="${max}" aria-valuenow="${used}"><i style="width:${pct}%"></i></span>`);
}
liveChip(); syncCount();
function cancChip(){
  const link=`<a href="https://www.parkrun.org.uk/cancellations/" target="_blank" rel="noopener" style="color:inherit">live list</a>`;
  if(CANC&&CANC.date===els.date.value){

    chip($("cancChip"),"Cancellations",[`checked ${t}`,`${n} UK events off`,link],false,false,{icon:"ban",text:`${n} cancelled · ${ts}`,alert:n>0});

cancChip();
$("places").innerHTML=[LOC,HOME.name,...all.map(e=>e.name).sort()].map(n=>`<option value="${n.replace(/"/g,"&quot;")}">`).join("");

// ---------- start location ----------
let gpsPoint=store.get("ptp.gps",null);
function locate(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){$("startHint").innerHTML=`<span class="err">This browser can’t share your location.</span>`;return resolve(null)}
    $("gps").classList.add("busy"); $("startHint").textContent="Finding your location…";
    const done=v=>{$("gps").classList.remove("busy");resolve(v)};
    const ok=p=>{gpsPoint={name:LOC,lat:p.coords.latitude,lon:p.coords.longitude,acc:Math.round(p.coords.accuracy||0),ts:Date.now()};store.set("ptp.gps",gpsPoint);done(gpsPoint)};
    const fail=(e,tryAgain)=>{
      if(tryAgain) return navigator.geolocation.getCurrentPosition(ok,e2=>fail(e2,false),{enableHighAccuracy:true,timeout:20000,maximumAge:0});
      const msg=e&&e.code===1?"Location is blocked for this page. In Chrome, tap the icon next to the address, then Permissions, and allow Location.":"Couldn’t get your location just now. Check location is switched on, then try again.";
      $("startHint").innerHTML=`<span class="err">${msg}</span>`; done(null);
    };
    navigator.geolocation.getCurrentPosition(ok,e=>fail(e,e&&e.code!==1),{enableHighAccuracy:false,timeout:12000,maximumAge:120000});
  });
}
$("gps").onclick=async()=>{const p=await locate(); if(p){els.start.value=LOC; run(lastLive)}};
async function resolveStart(txt){
  txt=(txt||"").trim(); if(!txt) return null;
  if(txt===LOC){ if(gpsPoint&&Date.now()-(gpsPoint.ts||0)<LOC_MAX_AGE) return gpsPoint; return (await locate())||null; }
  if(txt===HOME.name||/^home$|^hethersett$/i.test(txt)) return HOME;
  const ev=all.find(e=>e.name.toLowerCase()===txt.toLowerCase());
  if(ev) return {name:ev.name+" parkrun",lat:ev.lat,lon:ev.lon};
  let m=txt.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||txt.match(/[?&](?:q|ll|query|destination|origin)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i)||txt.match(/^(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)$/);
  if(m) return {name:`${(+m[1]).toFixed(4)}, ${(+m[2]).toFixed(4)}`,lat:+m[1],lon:+m[2]};
  const cache=store.get("ptp.geo",{}); if(cache[txt.toLowerCase()]) return cache[txt.toLowerCase()];
  try{
    let p=null;
    if(/^[A-Z]{1,2}\d[A-Z\d]?\s*\d[A-Z]{2}$/i.test(txt)){
      const r=await (await fetch(`https://api.postcodes.io/postcodes/${encodeURIComponent(txt)}`)).json();
      if(r.result) p={name:r.result.postcode,lat:r.result.latitude,lon:r.result.longitude};
    }else{
      const r=await (await fetch(`https://api.postcodes.io/places?q=${encodeURIComponent(txt)}&limit=5`)).json();
      const hit=(r.result||[]).find(x=>/City|Town|Village|Hamlet|Suburban/i.test(x.local_type))||(r.result||[])[0];
      if(hit) p={name:`${hit.name_1}${hit.county_unitary?", "+hit.county_unitary:""}`,lat:hit.latitude,lon:hit.longitude};
    }
    if(p){cache[txt.toLowerCase()]=p;store.set("ptp.geo",cache);return p}
  }catch(e){}
  return undefined;
}

// ---------- maths ----------
function hav(a,b,c,d){const R=6371,t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b);const h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function estMin(km){const road=km*1.25;const v=road<15?40:road<40?55:road<100?68:80;return {roadKm:road,min:Math.round(4+road/v*60)}}
const hm=m=>{m=((Math.floor(m)%1440)+1440)%1440;return `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`};
const dur=m=>{m=Math.round(m);return m<60?`${m} min`:`${Math.floor(m/60)}h ${String(m%60).padStart(2,"0")}`};
const secs=s=>parseInt(String(s).replace("s",""),10)/60;
function departIso(dateIso,minOfDay){
  const [y,mo,d]=dateIso.split("-").map(Number);
  const t=new Date(y,mo-1,d,0,0,0); t.setMinutes(minOfDay);
  const floor=Date.now()+2*60000; return new Date(Math.max(t.getTime(),floor)).toISOString();
}

// ---------- Google Routes ----------
async function gpost(url,body,mask){
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","X-Goog-Api-Key":els.key.value.trim(),"X-Goog-FieldMask":mask},body:JSON.stringify(body)});
  const j=await r.json(); if(!r.ok){const e=Array.isArray(j)?(j[0]&&j[0].error):j.error; throw new Error((e&&e.message)||("Google error "+r.status))} return j;
}
const ll=(lat,lon)=>({location:{latLng:{latitude:lat,longitude:lon}}});
function modifiers(withVehicle){
  const m={avoidTolls:els.tolls.checked,avoidHighways:els.high.checked,avoidFerries:els.ferry.checked};
  if(withVehicle) m.vehicleInfo={emissionType:els.car.value};
  return m;
}
function countUsage(n){const k="ptp.usage."+todayIso().slice(0,7);store.set(k,store.get(k,0)+n);return store.get(k,0)}

async function liveTimes(s,cands,early){
  // one matrix call for the shortlist, departing roughly when you'd need to leave
  const guessDepart=Math.min(...cands.map(c=>c.startMin-early-c.min));
  const body={origins:[{waypoint:ll(s.lat,s.lon),routeModifiers:modifiers(false)}],
    destinations:cands.map(c=>({waypoint:ll(c.lat,c.lon)})),
    travelMode:"DRIVE",routingPreference:"TRAFFIC_AWARE_OPTIMAL",trafficModel:els.traffic.value,
    departureTime:departIso(els.date.value,guessDepart)};
  const rows=await gpost("https://routes.googleapis.com/distanceMatrix/v2:computeRouteMatrix",body,"originIndex,destinationIndex,duration,distanceMeters,condition");
  countUsage(cands.length);
  rows.forEach(r=>{if(r.condition==="ROUTE_EXISTS"&&r.duration){const c=cands[r.destinationIndex];c.min=secs(r.duration);c.km=r.distanceMeters/1000;c.live=true}});
  return cands.filter(c=>c.live);
}
async function routeFor(s,c,early){
  const ref=routeType==="shortest"?["SHORTER_DISTANCE"]:routeType==="eco"?["FUEL_EFFICIENT"]:[];
  const body={origin:ll(s.lat,s.lon),destination:ll(c.lat,c.lon),travelMode:"DRIVE",routingPreference:"TRAFFIC_AWARE_OPTIMAL",
    trafficModel:els.traffic.value,departureTime:departIso(els.date.value,c.startMin-early-c.min),
    routeModifiers:modifiers(true),extraComputations:["FUEL_CONSUMPTION"]};
  if(ref.length) body.requestedReferenceRoutes=ref;
  const j=await gpost("https://routes.googleapis.com/directions/v2:computeRoutes",body,"routes.duration,routes.distanceMeters,routes.routeLabels,routes.travelAdvisory.fuelConsumptionMicroliters");
  countUsage(1);
  const routes=j.routes||[]; if(!routes.length) return;
  const want=routeType==="shortest"?"SHORTER_DISTANCE":routeType==="eco"?"FUEL_EFFICIENT":"DEFAULT_ROUTE";
  const fast=routes.find(r=>(r.routeLabels||[]).includes("DEFAULT_ROUTE"))||routes[0];
  const pick=routes.find(r=>(r.routeLabels||[]).includes(want))||fast;
  c.min=secs(pick.duration); c.km=pick.distanceMeters/1000; c.fastMin=secs(fast.duration);
  const fuel=pick.travelAdvisory&&pick.travelAdvisory.fuelConsumptionMicroliters;
  c.fuelL=fuel?(+fuel)/1e6:null; c.picked=(pick===fast&&want!=="DEFAULT_ROUTE")?"same as fastest":null;
}

try{localStorage.removeItem("ptp.done")}catch(e){}

// ---------- main ----------
let busy=false, lastLive=false;
async function run(useLive){
  if(busy) return; busy=true;
  try{
    saveSettings(); liveChip();
    const s=await resolveStart(els.start.value);
    if(!s){$("list").innerHTML="";$("summary").textContent="";if(els.start.value.trim()!==LOC)$("startHint").innerHTML=`<span class="err">Couldn’t find that start point.</span> Try a postcode, a town, a parkrun name or tap the location button.`;return}
    $("startHint").innerHTML=s.name===LOC?`Starting from your current location${s.acc?` <span class="nw">(within ${s.acc<1000?s.acc+"\u00a0m":(s.acc/1000).toFixed(1)+"\u00a0km"})</span>`:""}.`:(s.name===els.start.value.trim()||s.name===els.start.value.trim()+" parkrun"||s.name===HOME.name?"":`Starting from ${s.name}.`);
    const early=+els.early.value||0;
    cancChip();
    const cmap=cancFor(els.date.value), cancRows=[];
    let cands=all.filter(e=>els.inc.checked||!e.done)
      .map(e=>{const km=hav(s.lat,s.lon,e.lat,e.lon);const est=estMin(km);return {...e,isDone:e.done,km:est.roadKm,min:est.min,estMin:est.min,live:false}})
      .sort((a,b)=>a.min-b.min);
    {let kept=0; cands=cands.filter(c=>{const r=cmap[norm(c.name)];if(r){if(kept<10)cancRows.push({...c,canc:r.toLowerCase()});return false}kept++;return true})}
    let note="", blocked=false;
    if(useLive===true&&els.key.value.trim()){const why=await takeRefresh(); liveChip(); if(why){note=why;useLive=false;blocked=true}}
    if(useLive===true&&els.key.value.trim()){
      $("summary").textContent="Getting live drive times from Google…";
      try{
        const shortlist=cands.slice(0,CANDIDATES);
        const live=await liveTimes(s,shortlist,early);
        live.sort((a,b)=>a.min-b.min);
        cands=live.slice(0,10);
        await Promise.all(cands.map(c=>routeFor(s,c,early).catch(()=>{})));
      }catch(err){note=`Google didn’t respond (${err.message}), so these are estimates.`;cands=cands.slice(0,10)}
    }else cands=cands.slice(0,10);
    cands.forEach(c=>c.leave=c.startMin-early-c.min);
    const isToday=els.date.value===todayIso();
    const nd=new Date(), nowMin=nd.getHours()*60+nd.getMinutes();
    // On the day, once a leave-by time has passed, switch to "leaving now": arrival time and time spare before the start
    const enRoute=isToday&&cands.some(c=>c.leave<nowMin);
    if(enRoute){
      cands.forEach(c=>{c.arr=Math.ceil(nowMin+c.min);c.spare=c.startMin-c.arr});
      cands.sort((a,b)=>((a.spare<0)-(b.spare<0))||(a.arr-b.arr));
    }
    lastLive=cands.some(c=>c.live);
    const isLive=cands.some(c=>c.live);
    const upd=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
    const rShort={fastest:"fastest",shortest:"shortest",eco:"economical"}[routeType];
    const fDay=new Date(els.date.value+"T12:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
    const tapLive=els.key.value.trim()&&!blocked?" · tap Refresh for live":"";
    const line1=enRoute?(isLive?`Live traffic · leaving now ${hm(nowMin)} · ${rShort}`:`Estimated · leaving now ${hm(nowMin)}${tapLive}`):isLive?(isToday?`Live traffic · ${rShort} · ${upd}`:`Google forecast for ${fDay} · ${rShort} · ${upd}`):`Estimated times · ${upd}${tapLive}`;
    $("summary").innerHTML=`${blocked?"":`<span class="sline">${line1}</span>`}${note?`<span class="sline warn">${note}</span>`:""}`;
    const org=`${s.lat},${s.lon}`;
    // Cancelled events that would have made the list sit in their place, faded, unnumbered and without a route
    const rows=[...cands];
    // place by the same estimate for every card, so live times (usually shorter than estimates) don't push it off the list
    cancRows.forEach(c=>{let at=rows.findIndex(r=>!r.canc&&r.estMin>c.estMin); if(at<0) at=rows.length; rows.splice(at,0,c)});
    let rank=0, prevLate=false;
    $("list").innerHTML=rows.map(r=>{
      const tag=r.isDone?`<span class="tag">done${r.count?" ×"+r.count:""}</span>`:`<span class="tag new">new</span>`;
      if(r.canc) return `<li class="card cancelled">
        <span class="rank">–</span>
        <span class="name"><a href="https://www.parkrun.org.uk/${r.slug}/" target="_blank" rel="noopener">${r.name}</a></span>
        <div class="meta">${tag} <span class="nw">≈ ${dur(r.min)}</span> · <span class="nw">${Math.round(r.km*0.621)} mi</span></div>
        <span class="leave"><b>Cancelled</b><span class="spare">${r.canc}</span></span>
      </li>`;
      rank++; const i=rank-1;
      const extra=[];
      if(r.live&&routeType!=="fastest"&&r.fastMin&&Math.abs(r.fastMin-r.min)>=1) extra.push(`fastest ${dur(r.fastMin)}`);
      if(r.picked) extra.push(r.picked);
      if(r.live&&r.fuelL&&els.car.value!=="ELECTRIC") extra.push(`≈ ${r.fuelL.toFixed(1)} L fuel`);
      const late=enRoute&&r.spare<0, firstLate=late&&!prevLate; prevLate=late;
      const right=enRoute?`<span class="leave">Arrive<b>${hm(r.arr)}</b><span class="spare">${late?`${dur(-r.spare)} late`:`${dur(r.spare)} spare`}</span></span>`:`<span class="leave">Leave by<b>${hm(Math.floor(r.leave))}</b></span>`;
      return `${firstLate?`<li class="divider">Can’t make the start</li>`:""}<li class="card${late?" late":enRoute&&r.spare<5?" tight":""}">
        <span class="rank">${i+1}</span>
        <span class="name"><a href="https://www.parkrun.org.uk/${r.slug}/" target="_blank" rel="noopener">${r.name}</a></span>
        <div class="meta">${tag} ${[`<span class="nw">${r.live?"":"≈ "}${dur(r.min)}</span>`,`<span class="nw">${Math.round(r.km*0.621)} mi</span>`,...(r.startMin!==540?[`<span class="nw">starts ${hm(r.startMin)}</span>`]:[]),...extra.map(x=>`<span class="nw">${x}</span>`)].join(" · ")}</div>
        ${right}
        <a class="navbtn" href="https://www.google.com/maps/dir/?api=1&origin=${org}&destination=${r.lat},${r.lon}&travelmode=driving" target="_blank" rel="noopener" aria-label="Navigate to ${r.name} in Google Maps" title="Navigate in Google Maps">${ic("navigation")}</a>
      </li>`}).join("");
    const notes=[
      isLive?(isToday?`Times use live traffic from Google. It checked the ${CANDIDATES} nearest events, then planned your chosen route to the closest 10.`
                     :`Times are Google’s forecast, based on typical traffic for that Saturday morning. It checked the ${CANDIDATES} nearest events, then planned your chosen route to the closest 10.`)
            :`Times marked ≈ are rough estimates based on distance.${els.key.value.trim()&&!blocked?" Tap Refresh my top 10 for Google’s times.":""}`,
      enRoute?"Arrival times assume you set off now.":"",
      rows.some(r=>r.canc)?"Faded cards are cancelled and not counted in your 10.":"",
      "The arrow opens Google Maps, which may suggest a different route.",
      "Most events start at 9:00, or 9:30 in Scotland and Northern Ireland. Check the event’s page for any change."
    ].filter(Boolean);
    $("foot").innerHTML=notes.map(n=>`<p>${n}</p>`).join("");
  }finally{busy=false}
}
$("go").onclick=()=>run(true);
const toggleSettings=open=>{const p=$("settings");if(open===undefined)open=p.hidden;p.hidden=!open;$("setBtn").classList.toggle("on",open);$("setBtn").setAttribute("aria-expanded",String(open))};
